name: Linux Proton Bridge

on:
  push:
    branches:
      - master
      - "codex-*"
  pull_request:

jobs:
  linux-plugin-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S ts -B build/tfar-linux -DTFAR_LINUX_PLUGIN=ON -DTFAR_BRIDGE_PROTOCOL_TESTS=ON
      - name: Build
        run: cmake --build build/tfar-linux --config Release
      - name: Test
        run: ctest --test-dir build/tfar-linux --output-on-failure
      - name: Upload Linux plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: TFAR_linux_amd64
          path: build/tfar-linux/TFAR_linux_amd64.so

  windows-teamspeak-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Fetch Windows TeamSpeak plugin dependencies
        shell: pwsh
        run: |
          git config submodule.ts/include/freetype.url https://github.com/freetype/freetype.git
          git submodule update --init ts/include/freetype ts/include/glfw ts/include/glm
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows TeamSpeak plugin
        env:
          AppVeyor: isCI=1
        run: >
          msbuild ts/src/task_force_radio_plugin.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
      - name: Locate Windows TeamSpeak plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path ts/src -Recurse -Filter TFAR_win64.dll | Select-Object -First 1
          if (-not $plugin) {
            throw "TFAR_win64.dll was not produced"
          }
          Write-Host "Found $($plugin.FullName) ($($plugin.Length) bytes)"
      - name: Upload Windows TeamSpeak plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: TFAR_win64_windows_logging
          path: ts/src/**/TFAR_win64.dll

  windows-proton-bridge-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build loader and Proton bridge DLLs
        run: >
          msbuild extensions/task_force_radio_pipe/task_force_radio_pipe.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
      - name: Check Windows exports
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Host*\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe not found"
          }

          function Get-ExportNames($path) {
            (& $dumpbin.FullName /exports $path) | ForEach-Object {
              if ($_ -match '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)') {
                $Matches[1]
              }
            }
          }

          $pipeNames = @(Get-ExportNames "extensions/task_force_radio_pipe/x64/Release/task_force_radio_pipe_x64.dll")
          Write-Host "Pipe exports: $($pipeNames -join ', ')"
          if ($pipeNames -notcontains "RVExtension") {
            throw "task_force_radio_pipe_x64.dll does not export RVExtension"
          }

          $bridgeNames = @(Get-ExportNames "extensions/tfar_proton_bridge/x64/Release/tfar_proton_bridge_x64.dll")
          Write-Host "Bridge exports: $($bridgeNames -join ', ')"
          foreach ($name in @("TFARBridge_GetApiVersion", "TFARBridge_RVExtension", "TFARBridge_Shutdown")) {
            if ($bridgeNames -notcontains $name) {
              throw "tfar_proton_bridge_x64.dll does not export $name"
            }
          }
          if ($bridgeNames -contains "RVExtension") {
            throw "tfar_proton_bridge_x64.dll must not export plain RVExtension"
          }
      - name: Upload Arma loader DLL
        uses: actions/upload-artifact@v4
        with:
          name: task_force_radio_pipe_x64
          path: extensions/task_force_radio_pipe/x64/Release/task_force_radio_pipe_x64.dll
      - name: Upload Proton bridge DLL
        uses: actions/upload-artifact@v4
        with:
          name: tfar_proton_bridge_x64
          path: extensions/tfar_proton_bridge/x64/Release/tfar_proton_bridge_x64.dll
